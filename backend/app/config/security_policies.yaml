# 사용자 입력과 Agent Context, 최종 응답에 적용할 정책이다.
# 정책은 파일을 읽는 것만으로 적용되지 않으며 Backend 코드가 검사해야 한다.
input:
  max_length: 1000
  blocked_phrases:
    - 이전 지시를 무시
    - 시스템 프롬프트를 보여
    - 권한 검사를 건너뛰
    - ignore previous instructions
    - API Key를 알려줘

response:
  blocked_phrases:
    - 게임 서버에 적용되었습니다
    - 실제 운영 서버에 반영되었습니다
  sensitive_keys:
    - api_key
    - password
    - access_token
    - db_password
    - docker_token
    - ssh_private_key

# Agent 실행 직전에 허용된 키만 골라 Context를 만든다.
# actor_id, fault_type, idempotency_key와 Secret은 아래 목록에 넣지 않는다.
context_access:
  supervisor:
    - task_id
    - current_agent
    - owner_agent
    - error_type
    - error_reason
    - critic_status
    - workflow_status
    - approval_status
    - revision_count
    - max_revisions
    - retry_count
    - max_retries

  event_planner_agent:
    - user_request
    - planning_context
    - event_plan
    - error_type
    - error_reason
    - approval_comment
    - revision_count

  balance_rule_agent:
    - task_id
    - event_plan

  critic_agent:
    - task_id
    - user_request
    - event_plan
    - validation_result
    - error_type
    - error_reason
    - retry_count

  canonical_event_planner_agent:
    - brief
    - capabilities
    - runtime_evidence

  canonical_event_critic_agent:
    - brief
    - plan
    - planner_output
