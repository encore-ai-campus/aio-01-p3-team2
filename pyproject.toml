[tool.ruff]
target-version = "py311"
line-length = 100
src = ["frontend", "backend", "mcp_server"]

[tool.ruff.lint]
extend-select = ["I"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.pytest.ini_options]
testpaths = ["backend/tests", "mcp_server/tests", "demo-game/tests"]
addopts = "--import-mode=importlib"
