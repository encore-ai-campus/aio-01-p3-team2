name: Ikonly CI foundation

on:
  push:
    branches: [ikonly]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ikonly-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      ci_required: ${{ steps.impact.outputs.ci_required }}
      web_sites: ${{ steps.impact.outputs.web_sites }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compute CI candidates
        id: impact
        env:
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/ikonly
          python infra/aws/deployment_impact.py \
            --base "$BASE_SHA" --head "$HEAD_SHA" \
            --output deployment-impact.json --github-output "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: deployment-impact-${{ github.sha }}
          path: deployment-impact.json
          if-no-files-found: error

  quality-core:
    needs: changes
    if: needs.changes.outputs.ci_required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r backend/requirements.txt -r requirements-dev.txt
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m backend.scripts.export_planning_contract_schemas --check
      - run: python -m infra.aws.contracts --check
      - name: Core without cloud or paid dependencies
        env:
          WORKFLOW_ENGINE: mock
          CANONICAL_PLANNING_MODE: deterministic
        run: python -m pytest --test-profile core -q --junitxml=test-results/core.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-results
          path: test-results/core.xml
          if-no-files-found: warn

  web-build:
    needs: changes
    if: needs.changes.outputs.web_sites != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        site: ${{ fromJSON(needs.changes.outputs.web_sites) }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build the selected site
        env:
          SITE: ${{ matrix.site }}
        run: |
          set -euo pipefail
          case "$SITE" in
            plan) cd frontend-web ;;
            game) cd demo-game ;;
            *) exit 1 ;;
          esac
          pnpm install --frozen-lockfile
          pnpm build
          if [ "$SITE" = plan ]; then pnpm test:proxy; fi
      - uses: actions/upload-artifact@v4
        with:
          name: web-${{ matrix.site }}-${{ github.sha }}
          path: ${{ matrix.site == 'plan' && 'frontend-web/dist' || 'demo-game/dist' }}
          if-no-files-found: error

  foundation-summary:
    needs: [changes, quality-core, web-build]
    if: always()
    runs-on: ubuntu-latest
    env:
      CHANGE_RESULT: ${{ needs.changes.result }}
      CORE_RESULT: ${{ needs.quality-core.result }}
      WEB_RESULT: ${{ needs.web-build.result }}
      CI_REQUIRED: ${{ needs.changes.outputs.ci_required }}
      WEB_SITES: ${{ needs.changes.outputs.web_sites }}
    steps:
      - name: Validate selected foundation jobs
        run: |
          set -euo pipefail
          test "$CHANGE_RESULT" = success
          if [ "$CI_REQUIRED" = true ]; then test "$CORE_RESULT" = success; fi
          if [ "$WEB_SITES" != '[]' ]; then test "$WEB_RESULT" = success; fi
          cat >> "$GITHUB_STEP_SUMMARY" <<'SUMMARY'
          ## CI foundation only
          Changes, core quality, and selected web builds were checked.
          Deployment is disabled: PostgreSQL, production images, E2E,
          cloud access, and AWS deployment gates are not implemented yet.
          This run is not eligible for production promotion.
          SUMMARY
