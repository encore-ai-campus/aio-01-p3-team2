name: Ikonly infrastructure validation

on:
  workflow_dispatch:
  push:
    branches: [ikonly]
    paths:
      - 'infra/aws/**'
      - '.github/workflows/ikonly-infrastructure.yml'
      - 'backend/tests/unit/test_aws_infrastructure.py'

permissions:
  contents: read

concurrency:
  group: ikonly-infrastructure-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install locked CI tools
        run: python -m pip install --require-hashes -r infra/aws/requirements.ci.lock
      - name: Install locked CloudFormation checker
        run: python -m pip install --require-hashes -r infra/aws/requirements.iac.lock
      - name: Check deterministic templates and IaC contracts
        run: |
          python -m infra.aws.iac --check
          cfn-lint infra/aws/stacks/*.yml
          python -m pytest backend/tests/unit/test_aws_infrastructure.py -q
          bash -n infra/aws/scripts/bootstrap-host.sh infra/aws/scripts/preflight.sh infra/aws/scripts/export-environment.sh infra/aws/scripts/load-parameters.sh
      - name: Confirm account-free validation boundary
        run: echo 'Templates checked. No AWS login, changeset execution or OIDC role assumed. Live apply requires an account-bound reviewed changeset.'
