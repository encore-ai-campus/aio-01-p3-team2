# One application container per private EC2. Role and secrets come from host-only env_file.
services:
  application:
    image: ${APPLICATION_IMAGE:?An approved application image digest is required}
    env_file:
      - ${APPLICATION_ENV_FILE:?A role-scoped environment file is required}
    ports:
      - "${PRIVATE_BIND_IP:?Private host bind address required}:${SERVICE_PORT:?Role port required}:${SERVICE_PORT}"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 1536m
    cpus: 1.5
    restart: unless-stopped
    stop_grace_period: 60s
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
