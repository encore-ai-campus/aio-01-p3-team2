{
  "AWSTemplateFormatVersion": "2010-09-09",
  "Description": "Independent ikonly network; no SSH; one NAT, two DB AZs",
  "Parameters": {
    "OperatorCidr": {
      "Type": "String",
      "AllowedPattern": "[0-9.]+/(3[0-2]|[12]?[0-9])"
    }
  },
