        },
        "MapPublicIpOnLaunch": false,
        "Tags": [
          {
            "Key": "Environment",
            "Value": "ikonly-demo"
          },
          {
            "Key": "ManagedBy",
            "Value": "ikonly-iac"
          },
          {
            "Key": "OwnerStack",
            "Value": {
              "Ref": "AWS::StackName"
            }
          }
