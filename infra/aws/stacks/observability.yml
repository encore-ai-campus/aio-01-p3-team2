{
  "AWSTemplateFormatVersion": "2010-09-09",
  "Description": "Retained evidence and logs; SNS email requires recipient confirmation",
  "Parameters": {
    "NotificationEmail": {
      "Type": "String",
      "AllowedPattern": "[^\\s@]+@[^\\s@]+\\.[^\\s@]+"
    },
    "PlanWebInstance": {
      "Type": "String",
      "Default": ""
    },
    "GameWebInstance": {
      "Type": "String",
      "Default": ""
    },
    "MainApiInstance": {
      "Type": "String",
      "Default": ""
    },
    "FaultApiInstance": {
      "Type": "String",
      "Default": ""
    },
    "MainMcpInstance": {
      "Type": "String",
      "Default": ""
    },
    "FaultMcpInstance": {
      "Type": "String",
      "Default": ""
    }
  },
  "Resources": {
    "Topic": {
      "Type": "AWS::SNS::Topic",
      "Properties": {
        "Subscription": [
          {
            "Protocol": "email",
            "Endpoint": {
              "Ref": "NotificationEmail"
            }
          }
        ],
        "Tags": [
          {
            "Key": "Environment",
            "Value": "ikonly-demo"
          },
          {
            "Key": "ManagedBy",
            "Value": "ikonly-iac"
          },
          {
            "Key": "OwnerStack",
            "Value": {
              "Ref": "AWS::StackName"
            }
          }
        ]
      }
    },
    "PlanWebLogs": {
      "Type": "AWS::Logs::LogGroup",
      "Properties": {
        "LogGroupName": "/ikonly-demo/plan-web",
        "RetentionInDays": 14,
        "Tags": [
          {
            "Key": "Environment",
            "Value": "ikonly-demo"
          },
          {
            "Key": "ManagedBy",
            "Value": "ikonly-iac"
          },
          {
            "Key": "OwnerStack",
            "Value": {
              "Ref": "AWS::StackName"
            }
          },
          {
            "Key": "ServiceRole",
            "Value": "plan-web"
          }
        ]
      },
      "DeletionPolicy": "Retain",
      "UpdateReplacePolicy": "Retain"
    },
    "PlanWebCPUUtilization": {
      "Type": "AWS::CloudWatch::Alarm",
      "Properties": {
        "Namespace": "AWS/EC2",
        "MetricName": "CPUUtilization",
        "Dimensions": [
          {
            "Name": "InstanceId",
            "Value": {
              "Ref": "PlanWebInstance"
            }
          }
        ],
        "Statistic": "Average",
        "Period": 300,
        "EvaluationPeriods": 2,
        "Threshold": 80,
        "ComparisonOperator": "GreaterThanThreshold",
        "TreatMissingData": "missing",
        "AlarmActions": [
          {
            "Ref": "Topic"
          }
        ],
        "Tags": [
          {
            "Key": "Environment",
            "Value": "ikonly-demo"
          },
          {
            "Key": "ManagedBy",
            "Value": "ikonly-iac"
          },
          {
            "Key": "OwnerStack",
            "Value": {
              "Ref": "AWS::StackName"
            }
          },
          {
            "Key": "ServiceRole",
            "Value": "plan-web"
          }
        ]
      },
      "Condition": "PlanWebExists"
    },
    "PlanWebCPUCreditBalance": {
      "Type": "AWS::CloudWatch::Alarm",
      "Properties": {
        "Namespace": "AWS/EC2",
        "MetricName": "CPUCreditBalance",
        "Dimensions": [
          {
            "Name": "InstanceId",
            "Value": {
              "Ref": "PlanWebInstance"
