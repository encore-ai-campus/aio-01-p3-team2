{
  "AWSTemplateFormatVersion": "2010-09-09",
  "Description": "Runtime profiles with explicit parameter scope; GitHub roles initially disabled",
  "Parameters": {
    "EnableGithubRoles": {
      "Type": "String",
      "AllowedValues": [
        "true",
        "false"
      ],
      "Default": "false"
    },
    "GithubOidcProviderArn": {
      "Type": "String",
      "Default": ""
    }
  },
  "Resources": {
    "ApplicationRepository": {
      "Type": "AWS::ECR::Repository",
      "Properties": {
        "RepositoryName": "ikonly-demo/application",
        "ImageTagMutability": "IMMUTABLE",
        "ImageScanningConfiguration": {
          "ScanOnPush": true
        },
        "EncryptionConfiguration": {
          "EncryptionType": "AES256"
        },
        "Tags": [
          {
            "Key": "Environment",
            "Value": "ikonly-demo"
          },
          {
            "Key": "ManagedBy",
            "Value": "ikonly-iac"
          },
          {
            "Key": "OwnerStack",
            "Value": {
              "Ref": "AWS::StackName"
            }
          }
        ]
      },
      "DeletionPolicy": "Retain",
      "UpdateReplacePolicy": "Retain"
    },
    "WebRepository": {
      "Type": "AWS::ECR::Repository",
      "Properties": {
        "RepositoryName": "ikonly-demo/web",
        "ImageTagMutability": "IMMUTABLE",
        "ImageScanningConfiguration": {
          "ScanOnPush": true
        },
        "EncryptionConfiguration": {
          "EncryptionType": "AES256"
        },
        "Tags": [
          {
            "Key": "Environment",
            "Value": "ikonly-demo"
          },
          {
            "Key": "ManagedBy",
            "Value": "ikonly-iac"
          },
          {
            "Key": "OwnerStack",
            "Value": {
              "Ref": "AWS::StackName"
            }
          }
        ]
      },
      "DeletionPolicy": "Retain",
      "UpdateReplacePolicy": "Retain"
    },
    "PlanWebRole": {
      "Type": "AWS::IAM::Role",
      "Properties": {
        "RoleName": "ikonly-demo-plan-web",
        "AssumeRolePolicyDocument": {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Effect": "Allow",
              "Principal": {
                "Service": "ec2.amazonaws.com"
              },
              "Action": "sts:AssumeRole"
            }
          ]
        },
        "Policies": [
          {
            "PolicyName": "ScopedRuntime",
            "PolicyDocument": {
              "Version": "2012-10-17",
              "Statement": [
                {
                  "Effect": "Allow",
                  "Action": [
                    "ssm:GetParameter",
                    "ssm:GetParameters"
                  ],
                  "Resource": [
                    {
                      "Fn::Sub": "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/multi-agent-autohealing/ikonly-demo/plan/basic-auth-hash"
                    },
                    {
                      "Fn::Sub": "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/multi-agent-autohealing/ikonly-demo/proof/plan-main"
                    },
                    {
                      "Fn::Sub": "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/multi-agent-autohealing/ikonly-demo/proof/plan-fault"
                    }
                  ]
                },
                {
                  "Effect": "Allow",
                  "Action": [
                    "ecr:GetAuthorizationToken"
                  ],
                  "Resource": "*"
                },
                {
                  "Effect": "Allow",
                  "Action": [
                    "ecr:BatchGetImage",
                    "ecr:GetDownloadUrlForLayer",
                    "ecr:BatchCheckLayerAvailability"
                  ],
                  "Resource": [
                    {
                      "Fn::GetAtt": [
                        "WebRepository",
                        "Arn"
                      ]
                    }
                  ]
                },
                {
                  "Effect": "Allow",
                  "Action": [
                    "logs:CreateLogStream",
                    "logs:PutLogEvents"
                  ],
                  "Resource": {
                    "Fn::Sub": "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/ikonly-demo/plan-web:log-stream:*"
                  }
                },
                {
                  "Effect": "Allow",
                  "Action": [
                    "ssm:UpdateInstanceInformation",
                    "ssm:DescribeAssociation",
                    "ssm:ListInstanceAssociations",
                    "ssm:ListAssociations",
                    "ssm:GetDocument",
                    "ssm:DescribeDocument",
                    "ssm:UpdateAssociationStatus",
                    "ssm:UpdateInstanceAssociationStatus"
                  ],
                  "Resource": "*"
                },
                {
                  "Effect": "Allow",
                  "Action": [
                    "ssmmessages:CreateControlChannel",
                    "ssmmessages:CreateDataChannel",
                    "ssmmessages:OpenControlChannel",
                    "ssmmessages:OpenDataChannel"
                  ],
                  "Resource": "*"
                },
                {
                  "Effect": "Allow",
                  "Action": [
                    "ec2messages:AcknowledgeMessage",
                    "ec2messages:DeleteMessage",
                    "ec2messages:FailMessage",
                    "ec2messages:GetEndpoint",
                    "ec2messages:GetMessages",
                    "ec2messages:SendReply"
                  ],
                  "Resource": "*"
                }
              ]
            }
          }
        ],
        "Tags": [
          {
            "Key": "Environment",
            "Value": "ikonly-demo"
          },
          {
            "Key": "ManagedBy",
            "Value": "ikonly-iac"
          },
          {
            "Key": "OwnerStack",
            "Value": {
              "Ref": "AWS::StackName"
            }
          },
          {
            "Key": "ServiceRole",
            "Value": "plan-web"
          }
        ]
      }
    },
    "PlanWebProfile": {
      "Type": "AWS::IAM::InstanceProfile",
      "Properties": {
        "Roles": [
          {
            "Ref": "PlanWebRole"
          }
        ]
      }
    },
